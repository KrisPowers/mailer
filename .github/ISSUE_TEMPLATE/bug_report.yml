name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Leave out passwords, tokens, keys and real addresses. Security problems go through the private report linked from the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from the dashboard's Logs page or `docker logs mailer`.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit you're running.
  - type: input
    id: client
    attributes:
      label: Mail app
      description: For sign-in or sync problems, the app and platform (for example, Outlook on iOS).
