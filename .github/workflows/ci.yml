name: CI

# Runs on pull requests here, and on pushes to main and v* tags as the
# first stage of Release, which publishes the image only if this passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The dashboard builds are committed (internal/admin/web and
  # internal/webmail/web) so building
  # the server never needs Node. This rebuilds them from internal/ui,
  # publishes the result as the "web" artifact and fails if the committed
  # copy is out of date.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/ui/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            internal/admin/web
            internal/webmail/web
      - name: Committed build is current
        run: |
          changes=$(git status --porcelain -- ../admin/web ../webmail/web)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::a committed dashboard build is stale; commit the 'web' artifact from this run"
            exit 1
          fi

  # The container image: UI, server, cloudflared and Tailscale.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t mailer .
