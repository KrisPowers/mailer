name: CI

# Runs on pull requests here, and on pushes to main and v* tags as the
# first stage of Release, which publishes the image only if this passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The admin UI build is committed (internal/admin/web) so building the
  # server never needs Node. This rebuilds it, publishes the result as the
  # "web" artifact and fails if the committed copy is out of date.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/admin/ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/admin/ui/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: internal/admin/web
      - name: Committed build is current
        run: |
          changes=$(git status --porcelain -- ../web)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::internal/admin/web is stale; commit the 'web' artifact from this run"
            exit 1
          fi

  # The container image: UI, server, cloudflared and Tailscale.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -t mailer .
