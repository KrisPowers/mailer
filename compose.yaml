# Mailer in Docker. Start it with `docker compose up -d --build`, then open
# http://localhost:8080. Only this computer can reach the dashboard: mail
# arrives through the Cloudflare Tunnel and mail apps connect through
# Tailscale Funnel, both started from inside the container.
services:
  mailer:
    build: .
    image: mailer
    container_name: mailer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # dashboard
      - "127.0.0.1:8877:8877" # Cloudflare sign-in comes back here
    volumes:
      # Mail, accounts, keys and settings. On Windows this is the folder the
      # desktop app used, so an existing setup carries over.
      - ${LOCALAPPDATA:-.}/mailer/data:/data
    environment:
      # This server's name on your tailnet: mail apps connect to
      # <TS_HOSTNAME>.<tailnet>.ts.net.
      TS_HOSTNAME: mail
      # Optional: a Tailscale auth key signs in without the dashboard link.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # 1 logs every command mail apps send (passwords hidden), for
      # debugging sign-in and sync problems.
      MAILER_TRACE: ${MAILER_TRACE:-0}
    logging:
      options:
        max-size: 10m
        max-file: "3"
