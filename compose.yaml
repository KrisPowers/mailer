# Mailer in Docker. The installer (see README) runs it from the published
# image; from a checkout, `docker compose up -d --build` builds it here.
# Then open http://localhost:8080. Only this computer can reach the
# dashboard: mail arrives through the Cloudflare Tunnel and mail apps
# connect through Tailscale Funnel, both started from inside the container.
# Settings and keys go in a .env file next to this one (see .env.example).
name: mailer
services:
  mailer:
    image: ghcr.io/krispowers/mailer:latest
    build: .
    container_name: mailer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # dashboard
      - "127.0.0.1:8877:8877" # Cloudflare sign-in comes back here
    volumes:
      # Mail, accounts, keys and settings. MAILER_DATA_DIR picks the folder;
      # otherwise it's %LOCALAPPDATA%\mailer\data on Windows and
      # ./mailer/data elsewhere.
      - ${MAILER_DATA_DIR:-${LOCALAPPDATA:-.}/mailer/data}:/data
    environment:
      # This server's name on your tailnet: mail apps connect to
      # <TS_HOSTNAME>.<tailnet>.ts.net.
      TS_HOSTNAME: ${TS_HOSTNAME:-mail}
      # Optional: a Tailscale auth key signs in without the dashboard link.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # 1 logs every command mail apps send (passwords hidden), for
      # debugging sign-in and sync problems.
      MAILER_TRACE: ${MAILER_TRACE:-0}
      # Overrides the IMAP extensions advertised, for testing which ones a
      # mail app can't handle. Empty means the default set.
      MAILER_IMAP_CAPS: ${MAILER_IMAP_CAPS:-}
    logging:
      options:
        max-size: 10m
        max-file: "3"
